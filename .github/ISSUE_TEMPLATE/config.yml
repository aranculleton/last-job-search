blank_issues_enabled: true
contact_links:
  - name: Is this actually an upstream bug?
    url: https://github.com/MadsLorentzen/ai-job-search/issues
    about: >-
      This repo is a fork. If the problem is in code that came from upstream
      (the portal CLIs, the LaTeX scaffolding, lint_skills, security_guards,
      verify_pdf, robots_check, the salary tool), it affects every fork of that
      template and belongs on their tracker. Anything in tools/, the networking
      layer, the ranking pipeline or the methodology files is ours.
