# Everywhere: the places the app runs that CI's ordinary jobs do not (tools/everywhere.sh).
#
#   page    the page's browser tests in Safari's engine (the Claude app on an iPhone, Safari
#           on a Mac), Firefox, a Mac's and Windows' shapes of type, a device set to French or
#           German, and 14 hours ahead of London and 10 behind
#   suite   the rest of the suite with the clock 30, 90 and 400 days on, in the far time
#           zones, from a folder with spaces, an accent and an apostrophe, on the newest Python
#
# On a pull request labelled `release` and by hand, never on a schedule (a weekly run checked a
# master nothing had changed, its engines pinned; 2026-11-11): free on the public app, skipped on
# every private copy, never on an ordinary change. The page in four jobs side by side and the
# suite in seven, one variant each, every job ending in one short summary to read.
#
# The label, never the title: a "Release " title started this on every push, so a release's
# CHANGELOG pull request ran it four times (#206), and retitling a pull request started
# nothing. The run starts as the label goes on, and again on each push while it is on, and
# when a pull request opens or reopens with it on.
#
# No list of paths, unlike Platforms' plan: any change to the app can break any of these.

name: Everywhere

on:
  pull_request:
    # Each job runs only with the `release` label on (its `if:`); every other pull request
    # event starts a run whose jobs are all skipped, which costs nothing. `opened` and
    # `reopened` as Platforms has them (tools/ci_plan.py release_run): a release pull request
    # reopened with the label ran Windows there and nothing here until its next push.
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    # By hand, a few files in one or two engines: a failure reproduced in minutes, not the
    # whole page in all eight (Safari's and Firefox's findings at 4.12, which this container
    # cannot draw). Empty runs everything, as before.
    inputs:
      variants:
        description: "Page variants only (safari firefox mac-type windows-type french german ahead behind); empty: all"
        required: false
        default: ""
      tests:
        description: "Test files only, space separated; empty: all"
        required: false
        default: ""
      suite:
        description: "Run the suite job too"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# Another label going on a release pull request starts a run that does nothing: its own group
# keeps it from cancelling the run that is checking the release.
concurrency:
  group: everywhere-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'release' && 'other-label' || 'run' }}
  cancel-in-progress: true

jobs:
  page:
    # Four jobs side by side, not eight variants one after another: the release waited about
    # 50 minutes on this job alone (2026-10-29). Each installs only the engine it needs.
    name: page everywhere (${{ matrix.name }})
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.repository.private && ((github.event.action == 'labeled' && github.event.label.name == 'release') || ((github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && contains(github.event.pull_request.labels.*.name, 'release')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Safari
            variants: safari
            engines: webkit
          - name: Firefox
            variants: firefox
            engines: firefox
          - name: Mac and Windows type, French
            variants: mac-type windows-type french
            engines: chromium
          - name: German, far time zones
            variants: german ahead behind
            engines: chromium
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml pytest pytest-xdist
      - name: The variants asked for
        id: want
        env:
          ASKED: ${{ inputs.variants }}
          MINE: ${{ matrix.variants }}
        run: |
          v="$MINE"
          if [ -n "$ASKED" ]; then v=""; for m in $MINE; do case " $ASKED " in *" $m "*) v="$v $m" ;; esac; done; fi
          echo "variants=$(echo $v)" >> "$GITHUB_OUTPUT"
      - name: Playwright, the engine this job needs, and a Mac's and Windows' type
        if: ${{ steps.want.outputs.variants != '' }}
        env:
          PW: "1.56.1"            # the Playwright the page's harness is tested with
          ENGINES: ${{ matrix.engines }}
        run: |
          npm install -g "playwright@$PW"
          # As ci.yml: Ubuntu's mirror out of reach (2026-11-11) gets one try of four minutes at
          # most, then the engines alone; without the two fonts the Mac and Windows type say so.
          timeout 240 npx -y "playwright@$PW" install --with-deps $ENGINES || npx -y "playwright@$PW" install $ENGINES
          timeout 180 sudo apt-get install -y -q fonts-inter fonts-liberation > /dev/null || echo "fonts-inter and fonts-liberation did not install"
      - name: The page in each
        if: ${{ steps.want.outputs.variants != '' }}
        env:
          EVERYWHERE_STRICT: "1"
          EVERYWHERE_TESTS: ${{ inputs.tests }}
          VARIANTS: ${{ steps.want.outputs.variants }}
        run: tools/everywhere.sh page $VARIANTS

  suite:
    # Seven jobs side by side, one variant each: one after another they took 53 to 58 minutes
    # and one run stopped at the 60-minute limit (2026-11-11). The variants are
    # tools/everywhere.sh's own, and a test holds the two lists alike.
    name: suite everywhere (${{ matrix.variant }})
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite != false) || (!github.event.repository.private && ((github.event.action == 'labeled' && github.event.label.name == 'release') || ((github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && contains(github.event.pull_request.labels.*.name, 'release')))) }}
    runs-on: ubuntu-24.04
    # One variant is the whole suite once, about eight minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [30-days, 90-days, 400-days, ahead, behind, odd-folder, newest-python]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The last is the default; the newest is called by name.
          python-version: |
            3.14
            3.13
      - run: |
          python -m pip install pyyaml pytest pytest-xdist time-machine
          python3.14 -m pip install pyyaml pytest pytest-xdist
      - name: The suite, ${{ matrix.variant }}
        env:
          EVERYWHERE_STRICT: "1"
          PY: python
          PY_NEWEST: python3.14
          EVERYWHERE_TESTS: ${{ inputs.tests }}
          VARIANT: ${{ matrix.variant }}
        run: tools/everywhere.sh suite "$VARIANT"
