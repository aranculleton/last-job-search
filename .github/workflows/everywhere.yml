# Everywhere: the places the app runs that CI's ordinary jobs do not (tools/everywhere.sh).
#
#   page    the page's browser tests in Safari's engine (the Claude app on an iPhone, Safari
#           on a Mac), Firefox, a Mac's and Windows' shapes of type, a device set to French or
#           German, and 14 hours ahead of London and 10 behind
#   suite   the rest of the suite with the clock 30, 90 and 400 days on, in the far time
#           zones, from a folder with spaces, an accent and an apostrophe, on the newest Python
#
# On a release pull request (titled "Release X.Y.Z"), weekly and by hand: free on the public
# app, skipped on every private copy, never on an ordinary change. The page in four jobs side
# by side and the rest in one, each ending in one short summary to read (2026-10-29).
#
# No paths filter, unlike Platforms: any change to the app can break any of these.

name: Everywhere

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everywhere-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page:
    # Four jobs side by side, not eight variants one after another: the release waited about
    # 50 minutes on this job alone (2026-10-29). Each installs only the engine it needs.
    name: page everywhere (${{ matrix.name }})
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.repository.private && (github.event_name == 'schedule' || startsWith(github.event.pull_request.title, 'Release '))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Safari
            variants: safari
            engines: webkit
          - name: Firefox
            variants: firefox
            engines: firefox
          - name: Mac and Windows type, French
            variants: mac-type windows-type french
            engines: chromium
          - name: German, far time zones
            variants: german ahead behind
            engines: chromium
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml pytest pytest-xdist
      - name: Playwright, the engine this job needs, and a Mac's and Windows' type
        env:
          PW: "1.56.1"            # the Playwright the page's harness is tested with
          ENGINES: ${{ matrix.engines }}
        run: |
          npm install -g "playwright@$PW"
          npx -y "playwright@$PW" install --with-deps $ENGINES
          sudo apt-get install -y -q fonts-inter fonts-liberation > /dev/null
      - name: The page in each
        env:
          EVERYWHERE_STRICT: "1"
          VARIANTS: ${{ matrix.variants }}
        run: tools/everywhere.sh page $VARIANTS

  suite:
    name: suite everywhere (the clock moved on, far time zones, an odd folder, the newest Python)
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.repository.private && (github.event_name == 'schedule' || startsWith(github.event.pull_request.title, 'Release '))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The last is the default; the newest is called by name.
          python-version: |
            3.14
            3.13
      - run: |
          python -m pip install pyyaml pytest pytest-xdist time-machine
          python3.14 -m pip install pyyaml pytest pytest-xdist
      - name: The suite in each
        env:
          EVERYWHERE_STRICT: "1"
          PY: python
          PY_NEWEST: python3.14
        run: tools/everywhere.sh suite
