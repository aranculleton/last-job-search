# Weekly check that what the app says about the Claude app is still true. Reports
# only: it never edits the registry, the docs or any code.
#
# tools/claude_surfaces.json holds every statement the app makes about Claude's
# surfaces (a chat on the computer, a cloud chat, a phone, the browser pane,
# routines), each with the official page it rests on and a quote from that page.
# This fetches those pages and the Claude Code release notes and lists what needs a
# maintainer's look: a quote no longer on its page, an entry older than its
# `stale_after_days`, or a Claude Code release newer than the one the registry was
# checked against. The list goes into one rolling issue. A maintainer re-reads the
# page, fixes the entry, sets `verified_on`, and runs `claude_surfaces.py sync-docs`.
#
# Runs only in the public app, where Actions minutes are free: every private copy
# made with "Use this template" carries this file and never runs it (guarded below,
# and pinned by tests/test_claude_surfaces.py). The token is the built-in
# GITHUB_TOKEN, scoped to reading contents and writing issues in this repo only.

name: Claude surfaces watch

on:
  schedule:
    - cron: "0 9 * * 2" # 09:00 UTC every Tuesday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check the Claude surfaces registry against its sources
    if: github.repository == 'aranculleton/last-job-search'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check every entry
        id: watch
        run: |
          set +e
          {
            echo "_Last checked: $(date -u '+%Y-%m-%d %H:%M UTC') · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo
            python tools/claude_surfaces.py watch --strict
          } > report.md
          echo "found=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open or update the rolling issue
        if: steps.watch.outputs.found != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Claude surfaces to re-check"
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
